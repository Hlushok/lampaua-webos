<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Lampa - РљР°С‚Р°Р»РѕРі С„РёР»СЊРјРѕРІ Рё СЃРµСЂРёР°Р»РѕРІ</title>

    <meta name="referrer" content="never">

    <link rel="stylesheet" href="./vender/scrollbar/jquery.scrollbar.css">

</head>
    <style>
         .com-lampac-tv-init-container {
            background-color: #262829;
            padding: 2.5em;
            border-radius: 1em;
            width: 90%;
            max-width: 400px;
            text-align: center;
            display: none;
            /* РџРѕР·РёС†РёРѕРЅРёСЂРѕРІР°РЅРёРµ РґР»СЏ С†РµРЅС‚СЂРёСЂРѕРІР°РЅРёСЏ */
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
        }
        .com-lampac-tv-init-container.visible {
            display: block;
        }
        .com-lampac-tv-init-container h2 {
            font-size: 1.8em;
            margin-top: 0;
            margin-bottom: 1.2em;
        }
        .com-lampac-tv-init-url-Input {
            width: 100%;
            padding: 0.8em 1em;
            font-size: 1.1em;
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 0.5em;
            color: #fff;
            margin-bottom: 1.2em;
        }
        .com-lampac-tv-init-url-Input::placeholder {
            color: #6a6a6a;
        }
        .com-lampac-tv-init-ok-button {
            width: 100%;
            padding: 0.8em;
            font-size: 1.2em;
            background-color: rgba(0, 0, 0, 0.3);
            color: #fff;
            border: none;
            border-radius: 0.7em;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .com-lampac-tv-init-ok-button:hover,
        .com-lampac-tv-init-ok-button.focus {
            background-color: #fff;
            color: #000;
        }
        .com-lampac-tv-init-checkbox-container {
            display: flex;
            align-items: center;
            margin-bottom: 1.2em;
            text-align: left;
        }
        .com-lampac-tv-init-checkbox-container input[type="checkbox"] {
            margin-right: 0.8em;
            width: 1.2em;
            height: 1.2em;
            cursor: pointer;
        }
        .com-lampac-tv-init-checkbox-container label {
            color: #fff;
            cursor: pointer;
            font-size: 1em;
            user-select: none;
        }
       .com-lampac-tv-init-focused {
            box-shadow: 0 0 0 3px rgba(0, 255, 0, 0.5);
            transition: box-shadow 0.2s ease-in-out, border-color 0.2s ease-in-out;
       }
    </style>
</head>
    <div class="welcome"></div>

    <div id="app">

    </div>

    <div id="comlampactvinitcontainer" class="com-lampac-tv-init-container">
        <h2>РЈРєР°Р¶РёС‚Рµ Р°РґСЂРµСЃ Lampa</h2>
        <form id="comlampactvinitForm">
            <input type="url" id="comlampactviniturlInput" class="com-lampac-tv-init-url-Input" value="http://lampaua.mooo.com" readonly required />
            <div id="comlampactvinitcheckboxcontainer" class="com-lampac-tv-init-checkbox-container">
                <input type="checkbox" id="comlampactvcheckboxisLampac" name="isLampacServer">
                <label for="isLampacServer">Р­С‚Рѕ СЃРµСЂРІРµСЂ Lampac</label>
            </div>
            <button type="button" id="comlampactvinitokbutton" class="com-lampac-tv-init-ok-button">OK</button>
        </form>
    </div>

    <script>
        // РћРїСЂРµРґРµР»СЏРµРј РіР»РѕР±Р°Р»СЊРЅС‹Рµ С„СѓРЅРєС†РёРё Р”Рћ Р·Р°РіСЂСѓР·РєРё loader.js
        window.comlampactvshowinitForm = function() {
            console.log('Showing a form for entering a URL');

            let welcome = $('.welcome');

            if (welcome.length) {
                welcome.fadeOut(500);
            }

            document.getElementById('comlampactvinitcontainer').classList.add('visible');
            document.getElementById('comlampactviniturlInput').focus();
        };
    </script>
    
    <script src="./webOSTVjs-1.2.12/webOSTV.js"></script>
    <script src="./vender/jquery/jquery.js"></script>
    <script src="./vender/notify/notify.js"></script>
    <script src="./vender/scrollbar/jquery.scrollbar.js"></script>
    <script src="./vender/navigator/navigator.js"></script>
    <script src="./vender/keypad/keypad.js"></script>
    <script src="https://www.youtube.com/iframe_api" async></script>

    <script src="loader.js"></script>
    
    <script>
        
        document.addEventListener('DOMContentLoaded', function() {

            let lampac_url = localStorage.getItem('lampac_url');
            if (lampac_url) {
                return;
            }

            const var_comlampactviniturlInput = document.getElementById('comlampactviniturlInput');
            const var_comlampactvinitcheckboxcontainer = document.getElementById('comlampactvinitcheckboxcontainer');
            const var_comlampactvcheckboxisLampac = document.getElementById('comlampactvcheckboxisLampac');
            const var_comlampactvinitokbutton = document.getElementById('comlampactvinitokbutton');
            
            // РњР°СЃСЃРёРІ СЌР»РµРјРµРЅС‚РѕРІ РґР»СЏ РЅР°РІРёРіР°С†РёРё
            const focusableElements = [var_comlampactviniturlInput, var_comlampactvinitcheckboxcontainer, var_comlampactvinitokbutton];
            let currentFocusIndex = 0;
            
            // Р¤Р»Р°Рі РґР»СЏ РѕС‚СЃР»РµР¶РёРІР°РЅРёСЏ РІРёСЂС‚СѓР°Р»СЊРЅРѕР№ РєР»Р°РІРёР°С‚СѓСЂС‹
            let isKeyboardActive = false;
            
            // Р‘Р»РѕРє РґР»СЏ РєР°СЃС‚РѕРјРЅРѕР№ РѕС€РёР±РєРё
            const errorEl = document.createElement('div');
            errorEl.className = 'error-message';
            errorEl.textContent = 'РќРµРІРѕР·РјРѕР¶РЅРѕ СЃРѕРµРґРёРЅРёС‚СЊСЃСЏ СЃ СЃРµСЂРІРµСЂРѕРј!';
            errorEl.style.cssText = 'color: #ff4444; margin-top: 10px;';

            // РРЅРёС†РёР°Р»РёР·Р°С†РёСЏ
            function init() {
                // РЈСЃС‚Р°РЅР°РІР»РёРІР°РµРј С„РѕРєСѓСЃ РЅР° РїРѕР»Рµ РІРІРѕРґР° РїСЂРё Р·Р°РіСЂСѓР·РєРµ
                setFocus(0);
                
                // РћС‚РєР»СЋС‡Р°РµРј Р°РІС‚РѕРјР°С‚РёС‡РµСЃРєРѕРµ РѕС‚РєСЂС‹С‚РёРµ РєР»Р°РІРёР°С‚СѓСЂС‹
                var_comlampactviniturlInput.addEventListener('focus', function(e) {
                    e.preventDefault();
                    if (!isKeyboardActive) {
                        var_comlampactviniturlInput.blur();
                    }
                });
                
                // РћР±СЂР°Р±РѕС‚С‡РёРєРё РґР»СЏ СЌР»РµРјРµРЅС‚РѕРІ
                setupEventListeners();
            }
            
            // РќР°СЃС‚СЂРѕР№РєР° РѕР±СЂР°Р±РѕС‚С‡РёРєРѕРІ СЃРѕР±С‹С‚РёР№
            function setupEventListeners() {
                // РћР±СЂР°Р±РѕС‚С‡РёРє РґР»СЏ РєРЅРѕРїРєРё РћРљ РЅР° РїРѕР»Рµ РІРІРѕРґР°
                var_comlampactviniturlInput.addEventListener('click', function() {
                    if (currentFocusIndex === 0 && !isKeyboardActive) {
                        openVirtualKeyboard();
                    }
                });
                
                // РћР±СЂР°Р±РѕС‚С‡РёРє РґР»СЏ С‡РµРєР±РѕРєСЃР°
                var_comlampactvinitcheckboxcontainer.addEventListener('click', function() {
                    if (currentFocusIndex === 1) {
                        var_comlampactvcheckboxisLampac.checked = !var_comlampactvcheckboxisLampac.checked;
                    }
                });
                
                // РћР±СЂР°Р±РѕС‚С‡РёРє РґР»СЏ РєРЅРѕРїРєРё РћРљ
                var_comlampactvinitokbutton.addEventListener('click', function() {
                    TryConnect();
                });
                
                // РћР±СЂР°Р±РѕС‚С‡РёРє РєР»Р°РІРёС€ РїСѓР»СЊС‚Р°
                document.addEventListener('keydown', handleKeyDown);
            }
            
            // РћР±СЂР°Р±РѕС‚РєР° РЅР°Р¶Р°С‚РёР№ РєР»Р°РІРёС€
            function handleKeyDown(event) {
                switch(event.keyCode) {
                    case 13: // ENTER
                        handleEnterKey();
                        event.preventDefault();
                        break;
                        
                    case 38: // РЎС‚СЂРµР»РєР° Р’Р’Р•Р РҐ
                        navigate(-1);
                        event.preventDefault();
                        break;
                        
                    case 40: // РЎС‚СЂРµР»РєР° Р’РќРР—
                        navigate(1);
                        event.preventDefault();
                        break;
                        
                    case 461: // BACK
                        if (isKeyboardActive) {
                            closeVirtualKeyboard();
                            event.preventDefault();
                        }
                        break;
                }
            }
            
            // РћР±СЂР°Р±РѕС‚РєР° РЅР°Р¶Р°С‚РёСЏ ENTER
            function handleEnterKey() {
                switch(currentFocusIndex) {
                    case 0: // РџРѕР»Рµ РІРІРѕРґР°
                        if (!isKeyboardActive) {
                            openVirtualKeyboard();
                        } else {
                            // Р­РјСѓР»СЏС†РёСЏ РїРѕРґС‚РІРµСЂР¶РґРµРЅРёСЏ РІРІРѕРґР° СЃ РєР»Р°РІРёР°С‚СѓСЂС‹
                            simulateKeyboardSubmit();
                        }
                        break;
                        
                    case 1: // Р§РµРєР±РѕРєСЃ
                        var_comlampactvcheckboxisLampac.checked = !var_comlampactvcheckboxisLampac.checked;
                        break;
                        
                    case 2: // РљРЅРѕРїРєР° РћРљ
                        TryConnect();
                        break;
                }
            }
            
            // РќР°РІРёРіР°С†РёСЏ РїРѕ СЌР»РµРјРµРЅС‚Р°Рј
            function navigate(direction) {
                let newIndex = currentFocusIndex + direction;
                
                if (newIndex < 0) {
                    newIndex = focusableElements.length - 1;
                } else if (newIndex >= focusableElements.length) {
                    newIndex = 0;
                }
                
                setFocus(newIndex);
            }
            
            // РЈСЃС‚Р°РЅРѕРІРєР° С„РѕРєСѓСЃР° РЅР° СЌР»РµРјРµРЅС‚
            function setFocus(index) {
                // РЈР±РёСЂР°РµРј С„РѕРєСѓСЃ СЃРѕ РІСЃРµС… СЌР»РµРјРµРЅС‚РѕРІ
                focusableElements.forEach((el, i) => {
                    el.classList.remove('com-lampac-tv-init-focused');
                    if (el === var_comlampactviniturlInput) {
                        var_comlampactviniturlInput.classList.remove('com-lampac-tv-init-focused');
                    }
                });
                
                // РЈСЃС‚Р°РЅР°РІР»РёРІР°РµРј С„РѕРєСѓСЃ РЅР° РІС‹Р±СЂР°РЅРЅС‹Р№ СЌР»РµРјРµРЅС‚
                currentFocusIndex = index;
                const currentElement = focusableElements[index];
                
                currentElement.classList.add('com-lampac-tv-init-focused');
                if (currentElement === var_comlampactviniturlInput) {
                    var_comlampactviniturlInput.classList.add('com-lampac-tv-init-focused');
                }
            }
            
            // РћС‚РєСЂС‹С‚РёРµ РІРёСЂС‚СѓР°Р»СЊРЅРѕР№ РєР»Р°РІРёР°С‚СѓСЂС‹
            function openVirtualKeyboard() {
                isKeyboardActive = true;

                var_comlampactviniturlInput.removeAttribute('readonly');
                var_comlampactviniturlInput.focus();
                
                // Р”РѕР±Р°РІР»СЏРµРј РІРёР·СѓР°Р»СЊРЅСѓСЋ РёРЅРґРёРєР°С†РёСЋ
                var_comlampactviniturlInput.style.backgroundColor = 'rgba(255, 153, 0, 0.1)';
                
                // Р’С‹РґРµР»СЏРµРј РІРµСЃСЊ С‚РµРєСЃС‚ РґР»СЏ СѓРґРѕР±СЃС‚РІР° СЂРµРґР°РєС‚РёСЂРѕРІР°РЅРёСЏ
                setTimeout(() => {
                    var_comlampactviniturlInput.select();
                }, 100);
            }
            
            // Р—Р°РєСЂС‹С‚РёРµ РІРёСЂС‚СѓР°Р»СЊРЅРѕР№ РєР»Р°РІРёР°С‚СѓСЂС‹
            function closeVirtualKeyboard() {
                isKeyboardActive = false;
                
                var_comlampactviniturlInput.setAttribute('readonly', true);
                var_comlampactviniturlInput.blur();
                
                // РЈР±РёСЂР°РµРј РІРёР·СѓР°Р»СЊРЅСѓСЋ РёРЅРґРёРєР°С†РёСЋ
                var_comlampactviniturlInput.style.backgroundColor = '';
                
                // РџРµСЂРµРјРµС‰Р°РµРј С„РѕРєСѓСЃ РЅР° С‡РµРєР±РѕРєСЃ
                setFocus(1);
            }
            
            // Р­РјСѓР»СЏС†РёСЏ РїРѕРґС‚РІРµСЂР¶РґРµРЅРёСЏ РІРІРѕРґР° СЃ РєР»Р°РІРёР°С‚СѓСЂС‹
            function simulateKeyboardSubmit() {
                closeVirtualKeyboard();
            }
            
            // webOS СЃРїРµС†РёС„РёС‡РЅС‹Рµ РЅР°СЃС‚СЂРѕР№РєРё
            if (typeof webOS !== 'undefined') {
                // РћС‚РєР»СЋС‡Р°РµРј СЃС‚Р°РЅРґР°СЂС‚РЅРѕРµ РїРѕРІРµРґРµРЅРёРµ РєР»Р°РІРёР°С‚СѓСЂС‹
                webOS.keyboard = webOS.keyboard || {};
                webOS.keyboard.autoShow = false;
             }
            
            // РРЅРёС†РёР°Р»РёР·Р°С†РёСЏ РїСЂРё Р·Р°РіСЂСѓР·РєРµ
            init();

            function showConnectionError() {
                // Р”РѕР±Р°РІР»СЏРµРј РїРѕСЃР»Рµ С„РѕСЂРјС‹
                document.getElementById('comlampactvinitForm').appendChild(errorEl);
                
                // РЈРґР°Р»СЏРµРј С‡РµСЂРµР· 3 СЃРµРєСѓРЅРґС‹
                setTimeout(() => {
                   errorEl.remove();
                }, 3000);
            }

            function TryConnect() {
                let comlampactviniturlInput = document.getElementById('comlampactviniturlInput');
                let url = comlampactviniturlInput.value.trim();
    
                let fullURL ='';
    
                // Р”РѕР±Р°РІР»СЏРµРј РїСЂРѕС‚РѕРєРѕР», РµСЃР»Рё РµРіРѕ РЅРµС‚ (РїРѕ-СѓРјРѕР»С‡Р°РЅРёСЋ - http)
                if (!url.startsWith('http://') && !url.startsWith('https://')) {
                    fullURL = 'http://' + url;
                } else {
                    fullURL = url;
                }
    
                let isLampacServer = document.getElementById('comlampactvcheckboxisLampac').checked;

                var_comlampactvinitokbutton.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    var_comlampactvinitokbutton.style.transform = '';
                }, 300);

                checkConnection(fullURL,
                    function () {
                        document.removeEventListener('keydown', handleKeyDown);

                        let el = document.getElementById('comlampactvinitcontainer');
                        if (el) {
                          el.remove();
                        }
    
                        // РЎРѕС…СЂР°РЅСЏРµРј URL РІ localStorage
                        localStorage.setItem('lampac_url', fullURL);
                        localStorage.setItem('lampac_initiale', isLampacServer ? 'true' : '');

                        let welcome = $('.welcome');
                        if (welcome.length) {
                            welcome.fadeIn(500);
                        }

                        initLampaApp(isLampacServer);
                    },
                    function () {
                        showConnectionError();
                        console.log('No Network!');
                    });
            }
        });
    </script>
